name: Deploy - Cloud Run & Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: agent-md-506215
  SERVICE_NAME: appmy
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy Cloud Run
    runs-on: ubuntu-latest

    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias & Testar
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Autenticar no Google Cloud com chave de serviço
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Autenticar no Google Cloud com Workload Identity
        if: env.GCP_SA_KEY == '' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Validar credenciais do Google Cloud
        if: env.GCP_SA_KEY == '' && (env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '')
        run: |
          echo "::error::Configure GCP_SA_KEY or both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT."
          exit 1

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Deploy direto para o Cloud Run utilizando o Dockerfile do projeto
      - name: Deploy no Google Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars NODE_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }}
