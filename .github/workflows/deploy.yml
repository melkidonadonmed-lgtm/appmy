name: Deploy - Cloud Run & Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: agent-md-506215
  SERVICE_NAME: appmy
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias & Testar
        run: |
          npm ci
          npm run typecheck
          npm test

      # Autenticação no GCP (aceita Secret GCP_SA_KEY ou Workload Identity)
      - name: Autenticar no Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Deploy direto para o Cloud Run utilizando o Dockerfile do projeto
      - name: Deploy no Google Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars NODE_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }}
